<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Sweetheart ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#08000f;
  color:white;
  overflow:hidden;
}

.screen{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:25px;
  overflow:hidden;
}

.screen.active{
  display:flex;
  animation:fade .8s ease;
}

@keyframes fade{
  from{opacity:0}
  to{opacity:1}
}

.content{
  width:100%;
  max-width:420px;
  z-index:5;
}

h1{
  font-size:38px;
  margin-bottom:18px;
}

h2{
  font-size:30px;
  margin-bottom:15px;
}

p{
  font-size:18px;
  line-height:1.7;
  color:#ffe8f3;
}

button{
  border:none;
  padding:15px 28px;
  border-radius:50px;
  margin-top:28px;
  font-size:17px;
  font-weight:bold;
  background:white;
  color:#9b176b;
  box-shadow:0 8px 25px rgba(255,255,255,.2);
}

button:active{
  transform:scale(.94);
}

/* PASSWORD */
#lock{
  display:flex;
  background:radial-gradient(circle,#76145a,#16001d 70%);
}

.lock-icon{
  font-size:65px;
  margin-bottom:15px;
}

input{
  width:90%;
  max-width:300px;
  padding:15px;
  margin-top:20px;
  border:none;
  border-radius:30px;
  text-align:center;
  font-size:17px;
  outline:none;
}

.error{
  margin-top:15px;
  color:#ff9fc8;
  display:none;
}

/* FIRST */
#screen1{
  background:radial-gradient(circle,#6d164e,#17001f 65%);
}

.heart{
  font-size:65px;
  animation:beat 1.2s infinite
